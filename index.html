<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便利時計</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      background: url('bg.jpg') no-repeat center/cover fixed;
      background-color: #121212;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .app-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    .toolbar-left {
      font-weight: 600;
      font-size: 1rem;
    }
    .toolbar-right {
      display: flex;
      gap: 8px;
    }
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 15px 0;
    }
    .timer-display {
      font-size: 3rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 15px;
      color: #fff;
      letter-spacing: 1px;
    }
    .input-box {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      background: #388e3c;
      border: none;
      color: #fff;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-s {
      background: #1976d2;
    }
    .btn.wakelock-active {
      background: #27ae60 !important;
      border: 1px solid #2ecc71;
    }
    .date {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 2px;
    }
    .clock {
      text-align: center;
      font-size: 3.5rem;
      font-weight: 700;
      margin-top: 0;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .container {
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 20px;
      width: 380px;
      max-width: 90vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* ステータスバー（次のアラーム・進行中タイマー表示） */
    .status-bar {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 15px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      opacity: 0.85;
    }
    .menu-tab {
      position: fixed;
      right: 0;
      top: 42%;
      transform: translateY(-50%);
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(6px);
      padding: 12px 10px;
      border-radius: 12px 0 0 12px;
      cursor: pointer;
      writing-mode: vertical-rl;
      font-size: 0.9rem;
      letter-spacing: 2px;
      z-index: 15;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: none;
    }
    .timer-tab {
      position: fixed;
      right: 0;
      top: 58%;
      transform: translateY(-50%);
      background: rgba(25, 118, 210, 0.75);
      backdrop-filter: blur(6px);
      padding: 12px 10px;
      border-radius: 12px 0 0 12px;
      cursor: pointer;
      writing-mode: vertical-rl;
      font-size: 0.9rem;
      letter-spacing: 2px;
      z-index: 15;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: none;
    }
    .sidebar {
      position: fixed;
      right: -360px;
      top: 0;
      width: 330px;
      max-width: 90vw;
      height: 100vh;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 20px;
      box-sizing: border-box;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sidebar.open {
      right: 0;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      align-self: flex-end;
      opacity: 0.8;
    }
    .close-btn:hover {
      opacity: 1;
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .tool-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note, .screen, .todo-in, .chat-in, .alarm-in {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      padding: 7px;
      box-sizing: border-box;
      font-size: 0.85rem;
      outline: none;
    }
    .note:focus, .todo-in:focus, .chat-in:focus, .alarm-in:focus {
      border-color: rgba(255, 255, 255, 0.4);
    }
    .note {
      height: 70px;
      resize: none;
    }
    .screen {
      text-align: right;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 6px;
    }
    .c-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .c-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .c-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }
    .todo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .todo-list, .alarm-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
      max-height: 120px;
      overflow-y: auto;
    }
    .todo-item, .alarm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 8px;
    }
    .del-link {
      color: #e57373;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
    }
    .w-count {
      font-size: 0.75rem;
      text-align: right;
      opacity: 0.6;
      margin-top: 4px;
    }
    .sw-disp {
      font-size: 1.8rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-messages {
      height: 130px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
    }
    .chat-msg-item {
      word-break: break-all;
      line-height: 1.3;
    }
    /* スイッチ用トグル */
    .switch-label {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- 上部ツールバー -->
  <header class="app-toolbar">
    <div class="toolbar-left">便利時計</div>
    <div class="toolbar-right">
      <button class="btn btn-s" style="padding: 5px 10px; font-size: 0.8rem;" onclick="manualSendNotification()">通知テスト</button>
      <button id="wakeLockBtn" class="btn" style="padding: 5px 10px; font-size: 0.8rem;" onclick="toggleWakeLock()">スリープ: OFF</button>
    </div>
  </header>

  <div class="main-wrapper">
    <div class="container" id="panel">
      <!-- 進行状況・次のアラーム表示ステータスバー -->
      <div class="status-bar">
        <div class="status-item">
          <span>⏰ 次のアラーム:</span>
          <span id="status-next-alarm">なし</span>
        </div>
        <div class="status-item">
          <span>⏳ 進行中タイマー:</span>
          <span id="status-timer">停止中</span>
        </div>
      </div>

      <div class="date" id="d-disp"></div>
      <div class="clock" id="c-disp"></div>
      <div class="divider"></div>
      <div class="timer-display" id="t-clock">25:00</div>
      
      <div class="input-box">
        <button class="btn btn-s" id="s-btn" onclick="runT()">スタート</button>
        <button class="btn" style="background:#c2185b; display:none;" id="stop-alarm-btn" onclick="stopAlarm()">音を止める</button>
      </div>
    </div>
  </div>

  <div class="menu-tab" onclick="boxOpen()">ツール</div>
  <div class="timer-tab" onclick="timerBoxOpen()">タイマー設定</div>

  <div class="sidebar" id="box">
    <button class="close-btn" onclick="boxOpen()">✕</button>

    <!-- アラーム設定カード（新規追加） -->
    <div class="tool-card">
      <div class="tool-title">アラーム機能</div>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <input type="time" id="alarm-time-input" class="alarm-in">
        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="addAlarm()">追加</button>
      </div>
      <ul id="alarm-list" class="alarm-list"></ul>
    </div>

    <!-- やることリストカード（通知ON/OFF機能付き） -->
    <div class="tool-card">
      <div class="tool-title">
        やることリスト
        <label class="switch-label">
          <input type="checkbox" id="todo-notify-toggle" onchange="toggleFeatureNotify('todo')"> 通知ON
        </label>
      </div>
      <div class="todo-row">
        <input type="text" id="todo-input" class="todo-in" placeholder="新しいタスク...">
        <button class="btn" style="padding: 7px 12px;" onclick="addTodo()">追加</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>

    <!-- メモ帳カード（通知ON/OFF機能付き） -->
    <div class="tool-card">
      <div class="tool-title">
        メモ帳
        <label class="switch-label">
          <input type="checkbox" id="note-notify-toggle" onchange="toggleFeatureNotify('note')"> 通知ON
        </label>
      </div>
      <textarea class="note" id="note" oninput="saveN()" placeholder="ここにメモを入力..."></textarea>
      <div class="w-count" id="w-count">0 文字</div>
    </div>

    <div class="tool-card">
      <div class="tool-title" id="chat-header-title">チャット (未入室)[β]</div>
      <div id="room-login-area" style="display:flex; flex-direction:column; gap:6px;">
        <input type="text" id="room-id-input" class="chat-in" placeholder="部屋ID">
        <input type="password" id="room-pass-input" class="chat-in" placeholder="パスワード">
        <div style="display:flex; gap:4px; margin-top:2px;">
          <button class="btn" style="flex:1; font-size:0.8rem;" onclick="createRoom()">部屋を作成</button>
          <button class="btn btn-s" style="flex:1; font-size:0.8rem;" onclick="joinRoom()">部屋に入る</button>
        </div>
      </div>
      <div class="chat-container" id="chat-main-area" style="display:none; margin-top:4px;">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-name" class="chat-in" placeholder="名前" style="width: 30%;">
          <input type="text" id="chat-text" class="chat-in" placeholder="メッセージ" style="width: 50%;">
          <button class="btn" style="padding: 7px 12px;" onclick="sendChatMessage()">送信</button>
        </div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button class="btn" style="background:#d32f2f; flex:1; font-size:0.75rem;" onclick="leaveRoom()">部屋を出る</button>
          <button class="btn" style="background:#b71c1c; flex:1; font-size:0.75rem; display:none;" id="delete-room-btn" onclick="deleteRoom()">部屋を削除</button>
        </div>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">ストップウォッチ</div>
      <div class="sw-disp" id="sw-clock">00:00.0</div>
      <div style="display:flex;justify-content:center;gap:8px;">
        <button class="btn" id="sw-btn" onclick="toggleSW()">スタート</button>
        <button class="btn btn-s" onclick="resetSW()">リセット</button>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">電卓</div>
      <input type="text" class="screen" id="screen" readonly value="0">
      <div class="c-grid">
        <button class="c-btn" onclick="press('C')">C</button>
        <button class="c-btn" onclick="press('/')">÷</button>
        <button class="c-btn" onclick="press('*')">×</button>
        <button class="c-btn" onclick="press('-')">-</button>
        <button class="c-btn" onclick="press('7')">7</button>
        <button class="c-btn" onclick="press('8')">8</button>
        <button class="c-btn" onclick="press('9')">9</button>
        <button class="c-btn" onclick="press('+')">+</button>
        <button class="c-btn" onclick="press('4')">4</button>
        <button class="c-btn" onclick="press('5')">5</button>
        <button class="c-btn" onclick="press('6')">6</button>
        <button class="c-btn" onclick="press('=')">=</button>
        <button class="c-btn" onclick="press('1')">1</button>
        <button class="c-btn" onclick="press('2')">2</button>
        <button class="c-btn" onclick="press('3')">3</button>
        <button class="c-btn" onclick="press('0')">0</button>
      </div>
    </div>
  </div>

  <div class="sidebar" id="timer-box">
    <button class="close-btn" onclick="timerBoxOpen()">✕</button>
    <div class="tool-card">
      <div class="tool-title">タイマー設定</div>
      <div style="display:flex; justify-content:center; gap:15px; margin: 15px 0;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(600)">▲</button>
          <span id="p-min10" style="font-size:1.5rem; font-weight:bold; width:36px; text-align:center;">2</span>
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(-600)">▼</button>
          <span style="font-size:0.75rem; opacity:0.8;">10分</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(60)">▲</button>
          <span id="p-min1" style="font-size:1.5rem; font-weight:bold; width:36px; text-align:center;">5</span>
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(-60)">▼</button>
          <span style="font-size:0.75rem; opacity:0.8;">1分</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <span style="font-size:1.5rem; font-weight:bold;">:</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(10)">▲</button>
          <span id="p-sec10" style="font-size:1.5rem; font-weight:bold; width:36px; text-align:center;">0</span>
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(-10)">▼</button>
          <span style="font-size:0.75rem; opacity:0.8;">10秒</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(1)">▲</button>
          <span id="p-sec1" style="font-size:1.5rem; font-weight:bold; width:36px; text-align:center;">0</span>
          <button class="btn" style="width:36px; height:28px; padding:0;" onclick="adjustTime(-1)">▼</button>
          <span style="font-size:0.75rem; opacity:0.8;">1秒</span>
        </div>
      </div>
      <button class="btn" style="width:100%;" onclick="setT(); timerBoxOpen();">セットする</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoiks0JByNZN4zkT4F-trhHw_ysa6LPSY",
      authDomain: "clock-a1f74.firebaseapp.com",
      projectId: "clock-a1f74",
      storageBucket: "clock-a1f74.firebasestorage.app",
      messagingSenderId: "750778260472",
      appId: "1:750778260472:web:74ce3a4c5d1bef190a140d",
      measurementId: "G-ZL3Y106PN4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);
    let tInt, tLeft = 1500, pickerSec = 1500, swInt, swTime = 0, cur = '0';
    let currentRoomId = null;
    let unsubscribeChat = null;

    let myDeviceToken = localStorage.getItem('my_device_token');
    if (!myDeviceToken) {
      myDeviceToken = 'user_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('my_device_token', myDeviceToken);
    }

    const alarmAudio = new Audio('alarm.mp3');
    alarmAudio.loop = true;

    // データ格納用配列
    let alarms = [];
    let notificationSettings = {
      todo: false,
      note: false
    };

    window.addEventListener('DOMContentLoaded', () => {
      // 1. メモ帳復元
      const savedNote = localStorage.getItem('app_note');
      if (savedNote !== null) {
        $('note').value = savedNote;
        saveN();
      }

      // 2. やることリスト復元
      const savedTodos = localStorage.getItem('app_todos');
      if (savedTodos) {
        try {
          const todoListArray = JSON.parse(savedTodos);
          todoListArray.forEach(text => appendTodoToDOM(text));
        } catch(e){}
      }

      // 3. アラーム復元
      const savedAlarms = localStorage.getItem('app_alarms');
      if (savedAlarms) {
        try {
          alarms = JSON.parse(savedAlarms);
          renderAlarms();
        } catch(e){}
      }

      // 4. 通知設定復元
      const savedNotifyPrefs = localStorage.getItem('app_notify_prefs');
      if (savedNotifyPrefs) {
        try {
          notificationSettings = JSON.parse(savedNotifyPrefs);
          $('todo-notify-toggle').checked = notificationSettings.todo;
          $('note-notify-toggle').checked = notificationSettings.note;
        } catch(e){}
      }

      checkAndRequestNotification();
    });

    async function checkAndRequestNotification() {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') {
        try {
          await Notification.requestPermission();
        } catch (e) {
          console.error("通知許可の要求に失敗しました", e);
        }
      }
    }

    // 手動で通知を送信する関数（「通知テスト」ボタンから呼び出し）
    function manualSendNotification() {
      sendNotification('便利時計からの通知', 'あなたが送信したテスト通知です！');
    }

    function sendNotification(title, body) {
      if (!('Notification' in window)) {
        alert('このブラウザは通知をサポートしていません');
        return;
      }
      if (Notification.permission === 'granted') {
        new Notification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/3236/3236375.png'
        });
      } else {
        alert('通知の権限が許可されていません。ブラウザの設定を確認してください。');
        checkAndRequestNotification();
      }
    }

    // ==========================================
    // アラーム機能・管理
    // ==========================================
    function addAlarm() {
      const timeVal = $('alarm-time-input').value;
      if (!timeVal) {
        alert('時刻を選択してください');
        return;
      }
      alarms.push({ time: timeVal, active: true });
      saveAlarms();
      renderAlarms();
      $('alarm-time-input').value = '';
    }

    function deleteAlarm(index) {
      alarms.splice(index, 1);
      saveAlarms();
      renderAlarms();
    }

    function toggleAlarmActive(index) {
      alarms[index].active = !alarms[index].active;
      saveAlarms();
      renderAlarms();
    }

    function saveAlarms() {
      localStorage.setItem('app_alarms', JSON.stringify(alarms));
    }

    function renderAlarms() {
      const list = $('alarm-list');
      list.innerHTML = '';
      
      // 時刻順にソートして「次のアラーム」を算出するため
      alarms.sort((a, b) => a.time.localeCompare(b.time));

      alarms.forEach((alarm, index) => {
        const li = document.createElement('li');
        li.className = 'alarm-item';
        li.innerHTML = `
          <span style="${alarm.active ? '' : 'text-decoration:line-through; opacity:0.5;'} font-weight:bold;">⏰ ${alarm.time}</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <label class="switch-label"><input type="checkbox" ${alarm.active ? 'checked' : ''} onchange="toggleAlarmActive(${index})"> 有効</label>
            <span class="del-link" onclick="deleteAlarm(${index})">✕</span>
          </div>
        `;
        list.appendChild(li);
      });
      updateNextAlarmDisplay();
    }

    // 次のアラームをステータスバーに表示
    function updateNextAlarmDisplay() {
      const activeAlarms = alarms.filter(a => a.active);
      if (activeAlarms.length === 0) {
        $('status-next-alarm').innerText = 'なし';
        return;
      }
      const now = new Date();
      const currentHm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      
      // 本来の現在時刻以降の最も近いアラームを探す
      let next = activeAlarms.find(a => a.time >= currentHm);
      if (!next) {
        next = activeAlarms[0]; // なければ翌日の最初のアラーム
      }
      $('status-next-alarm').innerText = next.time + (next === activeAlarms[0] && next.time < currentHm ? ' (明日)' : '');
    }

    // ==========================================
    // 時計と毎秒のチェック処理
    // ==========================================
    function upClock() {
      const n = new Date();
      const hours = String(n.getHours()).padStart(2, '0');
      const minutes = String(n.getMinutes()).padStart(2, '0');
      const seconds = String(n.getSeconds()).padStart(2, '0');
      const currentHm = `${hours}:${minutes}`;

      $('d-disp').innerText = n.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
      $('c-disp').innerText = `${hours}:${minutes}:${seconds}`;

      // 毎秒アラーム時刻チェック
      alarms.forEach(alarm => {
        if (alarm.active && alarm.time === currentHm && seconds === '00') {
          triggerAlarmEvent(alarm.time);
        }
      });
    }
    setInterval(upClock, 1000);
    upClock();

    function triggerAlarmEvent(timeStr) {
      alarmAudio.play().catch(e => console.log(e));
      $('stop-alarm-btn').style.display = 'inline-block';
      sendNotification('アラーム発動！', `${timeStr} に設定したアラームの時間になりました。`);
    }

    // ==========================================
    // タイマー・ストップウォッチ関連
    // ==========================================
    function updatePickerDisplay() {
      if (pickerSec < 0) pickerSec = 0;
      if (pickerSec > 5999) pickerSec = 5999;
      const m = Math.floor(pickerSec / 60);
      const s = pickerSec % 60;
      $('p-min10').innerText = Math.floor(m / 10);
      $('p-min1').innerText = m % 10;
      $('p-sec10').innerText = Math.floor(s / 10);
      $('p-sec1').innerText = s % 10;
    }

    function adjustTime(amount) {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      pickerSec += amount;
      updatePickerDisplay();
    }

    function setT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      tLeft = pickerSec;
      dispT();
      $('status-timer').innerText = '待機中 (' + $('t-clock').innerText + ')';
    }

    function dispT() {
      const m = Math.floor(tLeft / 60).toString().padStart(2, '0');
      const s = (tLeft % 60).toString().padStart(2, '0');
      $('t-clock').innerText = `${m}:${s}`;
    }

    function runT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
        $('status-timer').innerText = '一時停止中';
      } else {
        if (tLeft <= 0) tLeft = pickerSec;
        if (tLeft <= 0) return;
        $('s-btn').innerText = '一時停止';
        
        tInt = setInterval(() => {
          if (tLeft > 0) {
            tLeft--;
            dispT();
            $('status-timer').innerText = `進行中 (${$('t-clock').innerText})`;
          } else {
            clearInterval(tInt);
            tInt = null;
            $('s-btn').innerText = 'スタート';
            $('status-timer').innerText = '終了しました';
            
            alarmAudio.play().catch(e => console.log(e));
            $('stop-alarm-btn').style.display = 'inline-block';
            sendNotification('タイマー終了', '設定した時間が経過しました！');
          }
        }, 1000);
      }
    }

    function stopAlarm() {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      $('stop-alarm-btn').style.display = 'none';
    }

    // ==========================================
    // メモ・やることリスト（通知ON/OFF対応）
    // ==========================================
    function toggleFeatureNotify(featureKey) {
      const isChecked = $(`${featureKey}-notify-toggle`).checked;
      notificationSettings[featureKey] = isChecked;
      localStorage.setItem('app_notify_prefs', JSON.stringify(notificationSettings));
      
      if (isChecked) {
        sendNotification('通知設定', `${featureKey === 'todo' ? 'やることリスト' : 'メモ帳'}の通知が有効になりました。`);
      }
    }

    function saveN() {
      const text = $('note').value;
      localStorage.setItem('app_note', text);
      $('w-count').innerText = `${text.length} 文字`;

      // メモ変更時の通知ONの場合の処理（必要に応じてトリガー可能）
    }

    function addTodo() {
      const i = $('todo-input');
      const val = i.value.trim();
      if (!val) return;
      
      appendTodoToDOM(val);
      saveTodosToLocalStorage();
      
      // やることリスト通知がONなら通知を飛ばす
      if (notificationSettings.todo) {
        sendNotification('新しいタスク追加', `「${val}」が追加されました。`);
      }
      i.value = '';
    }

    function appendTodoToDOM(text) {
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `<span>${escapeHTML(text)}</span><span class="del-link" onclick="removeTodo(this)">✕</span>`;
      $('todo-list').appendChild(li);
    }

    function removeTodo(element) {
      element.parentElement.remove();
      saveTodosToLocalStorage();
    }

    function saveTodosToLocalStorage() {
      const items = [];
      document.querySelectorAll('#todo-list .todo-item span').forEach(span => {
        items.push(span.innerText);
      });
      localStorage.setItem('app_todos', JSON.stringify(items));
    }

    // ==========================================
    // その他のツール（ストップウォッチ・電卓・チャット）
    // ==========================================
    let wakeLock = null;
    async function toggleWakeLock() {
      const btn = $('wakeLockBtn');
      if (wakeLock !== null) {
        await wakeLock.release();
        wakeLock = null;
        btn.textContent = 'スリープ: OFF';
        btn.classList.remove('wakelock-active');
        return;
      }
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          btn.textContent = 'スリープ: ON';
          btn.classList.add('wakelock-active');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            btn.textContent = 'スリープ: OFF';
            btn.classList.remove('wakelock-active');
          });
        } else {
          alert('このブラウザはスリープ防止をサポートしていません');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function boxOpen() { $('box').classList.toggle('open'); }
    function timerBoxOpen() { $('timer-box').classList.toggle('open'); }

    function toggleSW() {
      const b = $('sw-btn');
      if (swInt) {
        clearInterval(swInt);
        swInt = null;
        b.innerText = 'スタート';
      } else {
        b.innerText = 'ストップ';
        swInt = setInterval(() => {
          swTime += 100;
          const ts = Math.floor(swTime / 1000);
          $('sw-clock').innerText = `${Math.floor(ts / 60).toString().padStart(2, '0')}:${(ts % 60).toString().padStart(2, '0')}.${Math.floor((swTime % 1000) / 100)}`;
        }, 100);
      }
    }

    function resetSW() {
      clearInterval(swInt);
      swInt = null;
      swTime = 0;
      $('sw-clock').innerText = '00:00.0';
      $('sw-btn').innerText = 'スタート';
    }

    function press(v) {
      if (v === 'C') {
        cur = '0';
      } else if (v === '=') {
        try {
          cur = eval(cur.replace(/×/g, '*').replace(/÷/g, '/')).toString();
        } catch { cur = 'Error'; }
      } else {
        cur = cur === '0' && !isNaN(v) ? v : cur + v;
      }
      $('screen').value = cur;
    }

    async function createRoom() {
      const roomId = $('room-id-input').value.trim();
      const password = $('room-pass-input').value;
      if (!roomId || !password) return alert('入力してください');
      const roomRef = db.collection('rooms').doc(roomId);
      const doc = await roomRef.get();
      if (doc.exists) return alert('既に存在する部屋です');
      await roomRef.set({ password, ownerToken: myDeviceToken, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      enterRoom(roomId, true);
    }

    async function joinRoom() {
      const roomId = $('room-id-input').value.trim();
      const password = $('room-pass-input').value;
      if (!roomId || !password) return alert('入力してください');
      const roomRef = db.collection('rooms').doc(roomId);
      const doc = await roomRef.get();
      if (!doc.exists) return alert('部屋が見つかりません');
      if (doc.data().password !== password) return alert('パスワードが違います');
      enterRoom(roomId, doc.data().ownerToken === myDeviceToken);
    }

    function enterRoom(roomId, isOwner) {
      currentRoomId = roomId;
      $('room-login-area').style.display = 'none';
      $('chat-main-area').style.display = 'flex';
      $('chat-header-title').innerText = `部屋: ${roomId}`;
      $('delete-room-btn').style.display = isOwner ? 'block' : 'none';

      if (unsubscribeChat) unsubscribeChat();
      unsubscribeChat = db.collection('rooms').doc(roomId).collection('messages').orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          const chatMessages = $('chat-messages');
          chatMessages.innerHTML = '';
          snapshot.forEach((doc) => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = 'chat-msg-item';
            div.innerHTML = `<strong>${escapeHTML(data.name || '名無し')}:</strong> ${escapeHTML(data.text || '')}`;
            chatMessages.appendChild(div);
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    }

    function leaveRoom() {
      if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
      currentRoomId = null;
      $('chat-main-area').style.display = 'none';
      $('room-login-area').style.display = 'flex';
      $('chat-header-title').innerText = 'チャットルーム (未入室)';
    }

    async function deleteRoom() {
      if (!currentRoomId || !confirm('削除しますか？')) return;
      const roomRef = db.collection('rooms').doc(currentRoomId);
      const msgs = await roomRef.collection('messages').get();
      const batch = db.batch();
      msgs.forEach(doc => batch.delete(doc.ref));
      batch.delete(roomRef);
      await batch.commit();
      leaveRoom();
    }

    function sendChatMessage() {
      if (!currentRoomId) return;
      const name = $('chat-name').value.trim() || '名無し';
      const text = $('chat-text').value.trim();
      if (!text) return;
      db.collection('rooms').doc(currentRoomId).collection('messages').add({
        name, text, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => { $('chat-text').value = ''; });
    }

    function escapeHTML(str) {
      return str.replace(/[&'`<>"]/g, (m) => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }
  </script>
</body>
</html>
