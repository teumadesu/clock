<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便利時計</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      background: url('bg.jpg') no-repeat center/cover fixed;
      margin: 0;
      font-family: sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 15px 0;
    }
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      color: #fff;
    }
    .time-picker {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .time-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .picker-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      width: 36px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .picker-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }
    .picker-val {
      font-size: 1.5rem;
      font-weight: bold;
      width: 36px;
      text-align: center;
    }
    .picker-label {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .input-box {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      background: #4caf50;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-s {
      background: #2196f3;
    }
    .date {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      opacity: 0.9;
      margin-bottom: 2px;
    }
    .clock {
      text-align: center;
      font-size: 4rem;
      font-weight: bold;
      margin-top: 0;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .container {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    .menu-tab {
      position: fixed;
      right: 0;
      top: 42%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 12px;
      border-radius: 16px 0 0 16px;
      cursor: pointer;
      writing-mode: vertical-rl;
      font-size: 0.95rem;
      z-index: 15;
    }
    .timer-tab {
      position: fixed;
      right: 0;
      top: 58%;
      transform: translateY(-50%);
      background: rgba(33, 150, 243, 0.7);
      padding: 10px 12px;
      border-radius: 16px 0 0 16px;
      cursor: pointer;
      writing-mode: vertical-rl;
      font-size: 0.95rem;
      z-index: 15;
    }
    .sidebar {
      position: fixed;
      right: -340px;
      top: 0;
      width: 300px;
      max-width: 85vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      padding: 20px;
      box-sizing: border-box;
      transition: right 0.3s;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .sidebar.open {
      right: 0;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      align-self: flex-end;
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .tool-title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 3px;
    }
    .note, .screen, .todo-in, .chat-in {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      padding: 6px;
      box-sizing: border-box;
    }
    .note {
      height: 70px;
      resize: none;
    }
    .screen {
      text-align: right;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 6px;
    }
    .c-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .c-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .todo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
    }
    .todo-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .del-link {
      color: #ff6b6b;
      cursor: pointer;
    }
    .w-count {
      font-size: 0.75rem;
      text-align: right;
      opacity: 0.6;
    }
    .sw-disp {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 6px;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-messages {
      height: 120px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
    }
    .chat-msg-item {
      word-break: break-all;
    }
    .kiyaku {
      font-size: 0.7rem;
      text-align: center;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.8;
      width: 90%;
    }
    @media (max-width: 480px) {
      body {
        align-items: center;
      }
      .container {
        padding: 20px;
        width: 92vw;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.4);
      }
      .clock {
        font-size: 3rem;
      }
      .timer-display {
        font-size: 2.8rem;
      }
      .kiyaku {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="kiyaku" id="naiyo">
    <p>※当サイトのすべてのサービスを一度でも使用した場合、利用規約に同意したものと見なします<br>※メモ等のデータは保存されません</p>
  </div>

  <div class="container" id="panel">
    <div class="date" id="d-disp"></div>
    <div class="clock" id="c-disp"></div>
    <div class="divider"></div>
    <div class="timer-display" id="t-clock">25:00</div>
    
    <div class="input-box">
      <button class="btn btn-s" id="s-btn" onclick="runT()">スタート</button>
      <button class="btn" style="background:#e91e63; display:none;" id="stop-alarm-btn" onclick="stopAlarm()">音を止める</button>
    </div>
  </div>

  <div class="menu-tab" onclick="boxOpen()">⚙️ ツール</div>
  <div class="timer-tab" onclick="timerBoxOpen()">⏳ タイマー時間変更</div>

  <!-- ツールサイドバー -->
  <div class="sidebar" id="box">
    <button class="close-btn" onclick="boxOpen()">✕</button>

    <div class="tool-card">
      <div class="tool-title" id="chat-header-title">💬 チャットルーム (未入室)</div>
      
      <!-- 部屋作成・入室フォーム -->
      <div id="room-login-area" style="display:flex; flex-direction:column; gap:6px;">
        <input type="text" id="room-id-input" class="chat-in" placeholder="部屋ID">
        <input type="password" id="room-pass-input" class="chat-in" placeholder="パスワード">
        <div style="display:flex; gap:4px;">
          <button class="btn" style="flex:1;" onclick="createRoom()">部屋を作成</button>
          <button class="btn btn-s" style="flex:1;" onclick="joinRoom()">部屋に入る</button>
        </div>
      </div>

      <!-- チャット本体（入室後に表示） -->
      <div class="chat-container" id="chat-main-area" style="display:none; margin-top:8px;">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-name" class="chat-in" placeholder="名前" style="width: 30%;">
          <input type="text" id="chat-text" class="chat-in" placeholder="メッセージ" style="width: 50%;">
          <button class="btn" onclick="sendChatMessage()">送信</button>
        </div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button class="btn" style="background:#e91e63; flex:1; font-size:0.75rem;" onclick="leaveRoom()">部屋を出る</button>
          <button class="btn" style="background:#d32f2f; flex:1; font-size:0.75rem; display:none;" id="delete-room-btn" onclick="deleteRoom()">部屋を削除</button>
        </div>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">📝 メモ帳(β版)</div>
      <textarea class="note" id="note" oninput="saveN()"></textarea>
      <div class="w-count" id="w-count">0 文字</div>
    </div>

    <div class="tool-card">
      <div class="tool-title">✅ やることリスト(β版)</div>
      <div class="todo-row">
        <input type="text" id="todo-input" class="todo-in">
        <button class="btn" onclick="addTodo()">追加</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>

    <div class="tool-card">
      <div class="tool-title">⏱️ ストップウォッチ</div>
      <div class="sw-disp" id="sw-clock">00:00.0</div>
      <div style="display:flex;justify-content:center;gap:8px;">
        <button class="btn" id="sw-btn" onclick="toggleSW()">スタート</button>
        <button class="btn btn-s" onclick="resetSW()">リセット</button>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">🧮 電卓(β版)</div>
      <input type="text" class="screen" id="screen" readonly value="0">
      <div class="c-grid">
        <button class="c-btn" onclick="press('C')">C</button>
        <button class="c-btn" onclick="press('/')">÷</button>
        <button class="c-btn" onclick="press('*')">×</button>
        <button class="c-btn" onclick="press('-')">-</button>
        <button class="c-btn" onclick="press('7')">7</button>
        <button class="c-btn" onclick="press('8')">8</button>
        <button class="c-btn" onclick="press('9')">9</button>
        <button class="c-btn" onclick="press('+')">+</button>
        <button class="c-btn" onclick="press('4')">4</button>
        <button class="c-btn" onclick="press('5')">5</button>
        <button class="c-btn" onclick="press('6')">6</button>
        <button class="c-btn" onclick="press('=')">=</button>
        <button class="c-btn" onclick="press('1')">1</button>
        <button class="c-btn" onclick="press('2')">2</button>
        <button class="c-btn" onclick="press('3')">3</button>
        <button class="c-btn" onclick="press('0')">0</button>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">利用規約を必ずお読みください</div>
      <p style="font-size:0.75rem; line-height:1.4; margin:0;">
        <a href="kiyaku,porisi-.html" style="color: #fff;">利用規約・プライバシーポリシー</a>
      </p>
    </div>
  </div>

  <!-- タイマー時間変更サイドバー -->
  <div class="sidebar" id="timer-box">
    <button class="close-btn" onclick="timerBoxOpen()">✕</button>
    <div class="tool-card">
      <div class="tool-title">⏳ タイマー時間設定</div>
      <div class="time-picker" style="margin: 15px 0;">
        <div class="time-col">
          <button class="picker-btn" onclick="adjustTime(600)">▲</button>
          <span class="picker-val" id="p-min10">2</span>
          <button class="picker-btn" onclick="adjustTime(-600)">▼</button>
          <span class="picker-label">10分</span>
        </div>
        <div class="time-col">
          <button class="picker-btn" onclick="adjustTime(60)">▲</button>
          <span class="picker-val" id="p-min1">5</span>
          <button class="picker-btn" onclick="adjustTime(-60)">▼</button>
          <span class="picker-label">1分</span>
        </div>
        <div class="time-col">
          <span style="font-size:1.5rem; font-weight:bold; height:28px; display:flex; align-items:center;">:</span>
          <span style="height:28px;"></span>
          <span style="height:28px;"></span>
        </div>
        <div class="time-col">
          <button class="picker-btn" onclick="adjustTime(10)">▲</button>
          <span class="picker-val" id="p-sec10">0</span>
          <button class="picker-btn" onclick="adjustTime(-10)">▼</button>
          <span class="picker-label">10秒</span>
        </div>
        <div class="time-col">
          <button class="picker-btn" onclick="adjustTime(1)">▲</button>
          <span class="picker-val" id="p-sec1">0</span>
          <button class="picker-btn" onclick="adjustTime(-1)">▼</button>
          <span class="picker-label">1秒</span>
        </div>
      </div>
      <button class="btn" style="width:100%;" onclick="setT(); timerBoxOpen();">セットする</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoiks0JByNZN4zkT4F-trhHw_ysa6LPSY",
      authDomain: "clock-a1f74.firebaseapp.com",
      projectId: "clock-a1f74",
      storageBucket: "clock-a1f74.firebasestorage.app",
      messagingSenderId: "750778260472",
      appId: "1:750778260472:web:74ce3a4c5d1bef190a140d",
      measurementId: "G-ZL3Y106PN4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);
    let tInt, tLeft = 1500, pickerSec = 1500, swInt, swTime = 0, cur = '0';
    let currentRoomId = null;
    let unsubscribeChat = null;

    // ブラウザ固有の端末IDを生成して「部屋の主」判定に使う
    let myDeviceToken = localStorage.getItem('my_device_token');
    if (!myDeviceToken) {
      myDeviceToken = 'user_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('my_device_token', myDeviceToken);
    }

    const alarmAudio = new Audio('alarm.mp3');
    alarmAudio.loop = true;

    function boxOpen() {
      $('box').classList.toggle('open');
    }

    function timerBoxOpen() {
      $('timer-box').classList.toggle('open');
    }

    function upClock() {
      const n = new Date();
      $('d-disp').innerText = n.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
      $('c-disp').innerText = n.toLocaleTimeString('ja-JP', { hour12: false });
    }
    setInterval(upClock, 1000);
    upClock();

    function updatePickerDisplay() {
      if (pickerSec < 0) pickerSec = 0;
      if (pickerSec > 5999) pickerSec = 5999;
      const m = Math.floor(pickerSec / 60);
      const s = pickerSec % 60;
      $('p-min10').innerText = Math.floor(m / 10);
      $('p-min1').innerText = m % 10;
      $('p-sec10').innerText = Math.floor(s / 10);
      $('p-sec1').innerText = s % 10;
    }

    function adjustTime(amount) {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      pickerSec += amount;
      updatePickerDisplay();
    }

    function setT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      tLeft = pickerSec;
      dispT();
    }

    function dispT() {
      $('t-clock').innerText = `${Math.floor(tLeft / 60).toString().padStart(2, '0')}:${(tLeft % 60).toString().padStart(2, '0')}`;
    }

    function runT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      } else {
        if (tLeft <= 0) {
          tLeft = pickerSec;
        }
        if (tLeft <= 0) return;
        $('s-btn').innerText = '一時停止';
        tInt = setInterval(() => {
          if (tLeft > 0) {
            tLeft--;
            dispT();
          } else {
            clearInterval(tInt);
            tInt = null;
            $('s-btn').innerText = 'スタート';
            
            alarmAudio.play().catch(error => {
              console.log("音声の自動再生がブロックされました:", error);
            });
            $('stop-alarm-btn').style.display = 'inline-block';
            
            alert('時間です！');
          }
        }, 1000);
      }
    }

    function stopAlarm() {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      $('stop-alarm-btn').style.display = 'none';
    }

    function saveN() {
      $('w-count').innerText = `${$('note').value.length} 文字`;
    }

    function addTodo() {
      const i = $('todo-input');
      if (!i.value.trim()) return;
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `<span>${i.value}</span><span class="del-link" onclick="this.parentElement.remove()">✕</span>`;
      $('todo-list').appendChild(li);
      i.value = '';
    }

    function toggleSW() {
      const b = $('sw-btn');
      if (swInt) {
        clearInterval(swInt);
        swInt = null;
        b.innerText = 'スタート';
      } else {
        b.innerText = 'ストップ';
        swInt = setInterval(() => {
          swTime += 100;
          const ts = Math.floor(swTime / 1000);
          $('sw-clock').innerText = `${Math.floor(ts / 60).toString().padStart(2, '0')}:${(ts % 60).toString().padStart(2, '0')}.${Math.floor((swTime % 1000) / 100)}`;
        }, 100);
      }
    }

    function resetSW() {
      clearInterval(swInt);
      swInt = null;
      swTime = 0;
      $('sw-clock').innerText = '00:00.0';
      $('sw-btn').innerText = 'スタート';
    }

    function press(v) {
      if (v === 'C') {
        cur = '0';
      } else if (v === '=') {
        try {
          cur = eval(cur.replace(/×/g, '*').replace(/÷/g, '/')).toString();
        } catch {
          cur = 'Error';
        }
      } else {
        cur = cur === '0' && !isNaN(v) ? v : cur + v;
      }
      $('screen').value = cur;
    }

    // チャットルーム関連の処理
    async function createRoom() {
      const roomId = $('room-id-input').value.trim();
      const password = $('room-pass-input').value;
      if (!roomId || !password) {
        alert('部屋IDとパスワードを入力してください');
        return;
      }

      const roomRef = db.collection('rooms').doc(roomId);
      const doc = await roomRef.get();
      if (doc.exists) {
        alert('この部屋IDはすでに存在します。別のIDにするか「部屋に入る」をお試しください。');
        return;
      }

      // 部屋を作成し、作成者のトークンを保存
      await roomRef.set({
        password: password,
        ownerToken: myDeviceToken,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('部屋を作成しました！入室します。');
      enterRoom(roomId, true);
    }

    async function joinRoom() {
      const roomId = $('room-id-input').value.trim();
      const password = $('room-pass-input').value;
      if (!roomId || !password) {
        alert('部屋IDとパスワードを入力してください');
        return;
      }

      const roomRef = db.collection('rooms').doc(roomId);
      const doc = await roomRef.get();
      if (!doc.exists) {
        alert('指定された部屋が見つかりません');
        return;
      }

      if (doc.data().password !== password) {
        alert('パスワードが間違っています');
        return;
      }

      const isOwner = (doc.data().ownerToken === myDeviceToken);
      enterRoom(roomId, isOwner);
    }

    function enterRoom(roomId, isOwner) {
      currentRoomId = roomId;
      $('room-login-area').style.display = 'none';
      $('chat-main-area').style.display = 'flex';
      $('chat-header-title').innerText = `💬 部屋: ${roomId}`;

      // 主（オーナー）の場合のみ削除ボタンを表示
      if (isOwner) {
        $('delete-room-btn').style.display = 'block';
      } else {
        $('delete-room-btn').style.display = 'none';
      }

      // 既存のリスナーがあれば解除
      if (unsubscribeChat) unsubscribeChat();

      // ルームごとのメッセージを監視
      unsubscribeChat = db.collection('rooms').doc(roomId).collection('messages')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          const chatMessages = $('chat-messages');
          chatMessages.innerHTML = '';
          snapshot.forEach((doc) => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = 'chat-msg-item';
            div.innerHTML = `<strong>${escapeHTML(data.name || '名無し')}:</strong> ${escapeHTML(data.text || '')}`;
            chatMessages.appendChild(div);
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    }

    function leaveRoom() {
      if (unsubscribeChat) {
        unsubscribeChat();
        unsubscribeChat = null;
      }
      currentRoomId = null;
      $('chat-main-area').style.display = 'none';
      $('room-login-area').style.display = 'flex';
      $('chat-header-title').innerText = '💬 チャットルーム (未入室)';
      $('room-id-input').value = '';
      $('room-pass-input').value = '';
      $('delete-room-btn').style.display = 'none';
    }

    async function deleteRoom() {
      if (!currentRoomId) return;
      if (!confirm('本当にこの部屋を削除しますか？中のメッセージもすべて消去されます。')) return;

      try {
        const roomRef = db.collection('rooms').doc(currentRoomId);
        
        // まず中のメッセージをすべて取得して削除
        const messagesSnapshot = await roomRef.collection('messages').get();
        const batch = db.batch();
        messagesSnapshot.forEach((doc) => {
          batch.delete(doc.ref);
        });
        // ルーム本体も削除
        batch.delete(roomRef);
        await batch.commit();

        alert('部屋を削除しました。');
        leaveRoom();
      } catch (error) {
        console.error("部屋の削除に失敗しました: ", error);
        alert('部屋の削除に失敗しました。');
      }
    }

    function sendChatMessage() {
      if (!currentRoomId) return;
      const nameInput = $('chat-name');
      const textInput = $('chat-text');
      
      const name = nameInput.value.trim() || '名無し';
      const text = textInput.value.trim();
      
      if (!text) return;

      db.collection('rooms').doc(currentRoomId).collection('messages').add({
        name: name,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        textInput.value = '';
      })
      .catch((error) => {
        console.error("送信エラー: ", error);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&'`<>"]/g, (match) => {
        return {
          '&': '&amp;',
          "'": '&#x27;',
          '`': '&#x60;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
        }[match];
      });
    }
  </script>
</body>
</html>
