<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便利時計</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      background: url('bg.jpg') no-repeat center/cover fixed;
      margin: 0;
      font-family: sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 15px 0;
    }
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      color: #fff;
    }
    .input-box {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .t-input {
      width: 45px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid #fff;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      font-size: 1rem;
      padding: 2px;
    }
    .preset-box {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .preset-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .preset-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }
    .btn {
      background: #4caf50;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-s {
      background: #2196f3;
    }
    .date {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      opacity: 0.9;
      margin-bottom: 2px;
    }
    .clock {
      text-align: center;
      font-size: 4rem;
      font-weight: bold;
      margin-top: 0;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .container {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 16px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    .menu-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 12px;
      border-radius: 16px 0 0 16px;
      cursor: pointer;
      writing-mode: vertical-rl;
      font-size: 0.95rem;
      z-index: 15;
    }
    .sidebar {
      position: fixed;
      right: -340px;
      top: 0;
      width: 300px;
      max-width: 85vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      padding: 20px;
      box-sizing: border-box;
      transition: right 0.3s;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .sidebar.open {
      right: 0;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      align-self: flex-end;
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .tool-title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 3px;
    }
    .note, .screen, .todo-in, .chat-in {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      padding: 6px;
      box-sizing: border-box;
    }
    .note {
      height: 70px;
      resize: none;
    }
    .screen {
      text-align: right;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 6px;
    }
    .c-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .c-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .todo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
    }
    .todo-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .del-link {
      color: #ff6b6b;
      cursor: pointer;
    }
    .w-count {
      font-size: 0.75rem;
      text-align: right;
      opacity: 0.6;
    }
    .sw-disp {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 6px;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-messages {
      height: 120px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
    }
    .chat-msg-item {
      word-break: break-all;
    }
    .kiyaku {
      font-size: 0.7rem;
      text-align: center;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.8;
      width: 90%;
    }
    @media (max-width: 480px) {
      .container {
        padding: 20px;
        width: 100%;
        border-radius: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
      }
      .clock {
        font-size: 3.2rem;
      }
      .timer-display {
        font-size: 3rem;
      }
      .kiyaku {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="kiyaku" id="naiyo">
    <p>※当サイトのすべてのサービスを一度でも使用した場合、利用規約に同意したものと見なします<br>※メモ等のデータは保存されません</p>
  </div>

  <div class="container" id="panel">
    <div class="date" id="d-disp"></div>
    <div class="clock" id="c-disp"></div>
    <div class="divider"></div>
    <div class="timer-display" id="t-clock">25:00</div>
    <div class="preset-box">
      <button class="preset-btn" onclick="addTime(30)">+30秒</button>
      <button class="preset-btn" onclick="addTime(60)">+1分</button>
      <button class="preset-btn" onclick="addTime(300)">+5分</button>
      <button class="preset-btn" onclick="addTime(600)">+10分</button>
      <button class="preset-btn" onclick="resetTimerInput()">リセット</button>
    </div>
    <div class="input-box">
      <input type="number" id="t-min" class="t-input" value="25" min="0"><span>分</span>
      <input type="number" id="t-sec" class="t-input" value="0" min="0" max="59"><span>秒</span>
      <button class="btn" onclick="setT()">セット</button>
      <button class="btn btn-s" id="s-btn" onclick="runT()">スタート</button>
      <button class="btn" style="background:#e91e63; display:none;" id="stop-alarm-btn" onclick="stopAlarm()">音を止める</button>
    </div>
  </div>

  <div class="menu-tab" onclick="boxOpen()">⚙️ ツール</div>

  <div class="sidebar" id="box">
    <button class="close-btn" onclick="boxOpen()">✕</button>

    <div class="tool-card">
      <div class="tool-title">💬 チャット(β版)</div>
      <div class="chat-container">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-name" class="chat-in" placeholder="名前" style="width: 30%;">
          <input type="text" id="chat-text" class="chat-in" placeholder="メッセージ" style="width: 50%;">
          <button class="btn" onclick="sendChatMessage()">送信</button>
        </div>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">📝 メモ帳(β版)</div>
      <textarea class="note" id="note" oninput="saveN()"></textarea>
      <div class="w-count" id="w-count">0 文字</div>
    </div>

    <div class="tool-card">
      <div class="tool-title">✅ やることリスト(β版)</div>
      <div class="todo-row">
        <input type="text" id="todo-input" class="todo-in">
        <button class="btn" onclick="addTodo()">追加</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>

    <div class="tool-card">
      <div class="tool-title">⏱️ ストップウォッチ</div>
      <div class="sw-disp" id="sw-clock">00:00.0</div>
      <div style="display:flex;justify-content:center;gap:8px;">
        <button class="btn" id="sw-btn" onclick="toggleSW()">スタート</button>
        <button class="btn btn-s" onclick="resetSW()">リセット</button>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">🧮 電卓(β版)</div>
      <input type="text" class="screen" id="screen" readonly value="0">
      <div class="c-grid">
        <button class="c-btn" onclick="press('C')">C</button>
        <button class="c-btn" onclick="press('/')">÷</button>
        <button class="c-btn" onclick="press('*')">×</button>
        <button class="c-btn" onclick="press('-')">-</button>
        <button class="c-btn" onclick="press('7')">7</button>
        <button class="c-btn" onclick="press('8')">8</button>
        <button class="c-btn" onclick="press('9')">9</button>
        <button class="c-btn" onclick="press('+')">+</button>
        <button class="c-btn" onclick="press('4')">4</button>
        <button class="c-btn" onclick="press('5')">5</button>
        <button class="c-btn" onclick="press('6')">6</button>
        <button class="c-btn" onclick="press('=')">=</button>
        <button class="c-btn" onclick="press('1')">1</button>
        <button class="c-btn" onclick="press('2')">2</button>
        <button class="c-btn" onclick="press('3')">3</button>
        <button class="c-btn" onclick="press('0')">0</button>
      </div>
    </div>

    <div class="tool-card">
      <div class="tool-title">利用規約を必ずお読みください</div>
      <p style="font-size:0.75rem; line-height:1.4; margin:0;">
        <a href="kiyaku,porisi-.html" style="color: #fff;">利用規約・プライバシーポリシー</a>
      </p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoiks0JByNZN4zkT4F-trhHw_ysa6LPSY",
      authDomain: "clock-a1f74.firebaseapp.com",
      projectId: "clock-a1f74",
      storageBucket: "clock-a1f74.firebasestorage.app",
      messagingSenderId: "750778260472",
      appId: "1:750778260472:web:74ce3a4c5d1bef190a140d",
      measurementId: "G-ZL3Y106PN4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);
    let tInt, tLeft = 1500, swInt, swTime = 0, cur = '0', auds = {};

    const alarmAudio = new Audio('alarm.mp3');
    alarmAudio.loop = true;

    function boxOpen() {
      $('box').classList.toggle('open');
    }

    function upClock() {
      const n = new Date();
      $('d-disp').innerText = n.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
      $('c-disp').innerText = n.toLocaleTimeString('ja-JP', { hour12: false });
    }
    setInterval(upClock, 1000);
    upClock();

    function setT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      const m = parseInt($('t-min').value) || 0;
      const s = parseInt($('t-sec').value) || 0;
      tLeft = (m * 60) + s;
      dispT();
    }

    function addTime(secs) {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      tLeft += secs;
      updateInputsFromTLeft();
      dispT();
    }

    function resetTimerInput() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      }
      tLeft = 0;
      updateInputsFromTLeft();
      dispT();
    }

    function updateInputsFromTLeft() {
      $('t-min').value = Math.floor(tLeft / 60);
      $('t-sec').value = tLeft % 60;
    }

    function dispT() {
      $('t-clock').innerText = `${Math.floor(tLeft / 60).toString().padStart(2, '0')}:${(tLeft % 60).toString().padStart(2, '0')}`;
    }

    function runT() {
      if (tInt) {
        clearInterval(tInt);
        tInt = null;
        $('s-btn').innerText = 'スタート';
      } else {
        if (tLeft <= 0) {
          setT();
        }
        if (tLeft <= 0) return;
        $('s-btn').innerText = '一時停止';
        tInt = setInterval(() => {
          if (tLeft > 0) {
            tLeft--;
            dispT();
            updateInputsFromTLeft();
          } else {
            clearInterval(tInt);
            tInt = null;
            $('s-btn').innerText = 'スタート';
            
            alarmAudio.play().catch(error => {
              console.log("音声の自動再生がブロックされました:", error);
            });
            $('stop-alarm-btn').style.display = 'inline-block';
            
            alert('時間です！');
          }
        }, 1000);
      }
    }

    function stopAlarm() {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      $('stop-alarm-btn').style.display = 'none';
    }

    function saveN() {
      $('w-count').innerText = `${$('note').value.length} 文字`;
    }

    function addTodo() {
      const i = $('todo-input');
      if (!i.value.trim()) return;
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `<span>${i.value}</span><span class="del-link" onclick="this.parentElement.remove()">✕</span>`;
      $('todo-list').appendChild(li);
      i.value = '';
    }

    function toggleSW() {
      const b = $('sw-btn');
      if (swInt) {
        clearInterval(swInt);
        swInt = null;
        b.innerText = 'スタート';
      } else {
        b.innerText = 'ストップ';
        swInt = setInterval(() => {
          swTime += 100;
          const ts = Math.floor(swTime / 1000);
          $('sw-clock').innerText = `${Math.floor(ts / 60).toString().padStart(2, '0')}:${(ts % 60).toString().padStart(2, '0')}.${Math.floor((swTime % 1000) / 100)}`;
        }, 100);
      }
    }

    function resetSW() {
      clearInterval(swInt);
      swInt = null;
      swTime = 0;
      $('sw-clock').innerText = '00:00.0';
      $('sw-btn').innerText = 'スタート';
    }

    function press(v) {
      if (v === 'C') {
        cur = '0';
      } else if (v === '=') {
        try {
          cur = eval(cur.replace(/×/g, '*').replace(/÷/g, '/')).toString();
        } catch {
          cur = 'Error';
        }
      } else {
        cur = cur === '0' && !isNaN(v) ? v : cur + v;
      }
      $('screen').value = cur;
    }

    function sendChatMessage() {
      const nameInput = $('chat-name');
      const textInput = $('chat-text');
      
      const name = nameInput.value.trim() || '名無し';
      const text = textInput.value.trim();
      
      if (!text) return;

      db.collection('messages').add({
        name: name,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        textInput.value = '';
      })
      .catch((error) => {
        console.error("送信エラー: ", error);
      });
    }

    db.collection('messages').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
      const chatMessages = $('chat-messages');
      chatMessages.innerHTML = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = 'chat-msg-item';
        div.innerHTML = `<strong>${escapeHTML(data.name)}:</strong> ${escapeHTML(data.text)}`;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    function escapeHTML(str) {
      return str.replace(/[&'`<>"]/g, (match) => {
        return {
          '&': '&amp;',
          "'": '&#x27;',
          '`': '&#x60;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
        }[match];
      });
    }
  </script>
</body>
</html>
